name: Update Jimothy Log

on:
  repository_dispatch:
    types: [update-log]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Append new sighting to JSON
        run: |
          echo "${{ github.event.client_payload.payload }}" > data/tmp.json
          jq --argjson entry "${{ github.event.client_payload.new_entry }}" \
             '.locations += [$entry]' data/tmp.json > data/jimothy.json
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting"
          git push

