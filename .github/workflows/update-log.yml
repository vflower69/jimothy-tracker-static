name: Update Jimothy Log

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Full JSON payload (existing data)"
        required: true
        type: string
      new_entry:
        description: "New sighting entry (single object)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Append new sighting to JSON
        shell: bash
        run: |
          # Write each input to its own file
          echo '${{ inputs.payload }}' | jq '.' > data/tmp.json
          echo '${{ inputs.new_entry }}' | jq '.' > data/new_entry.json

          # Merge new entry into locations array
          jq --slurpfile entry data/new_entry.json '.locations += $entry' data/tmp.json > data/jimothy.json

          # Commit and push
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting"
          git push
