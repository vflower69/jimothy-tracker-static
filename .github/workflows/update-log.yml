name: Update Jimothy Log

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Full JSON payload (existing data)"
        required: true
        type: string
      new_entry:
        description: "New sighting entry (single object)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so pull/rebase works

      - name: Sync with remote main BEFORE changes
        shell: bash
        run: |
          git pull --rebase origin main

      - name: Append new sighting to JSON
        shell: bash
        run: |
          # Validate and write payload
          echo "${{ inputs.payload }}" | jq '.' > data/tmp.json

          # Validate and write new_entry
          echo "${{ inputs.new_entry }}" | jq '.' > data/new_entry.json

          # Merge new entry into locations array
          jq --slurpfile entry data/new_entry.json \
             '.locations += $entry' data/tmp.json > data/jimothy.json

          # Configure Git identity
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"

          # Stage and commit
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting" || echo "No changes to commit"

          # Push to main
          #git push origin main

