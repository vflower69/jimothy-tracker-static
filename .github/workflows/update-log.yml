name: Update Jimothy Log

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Full JSON payload"
        required: true
        type: string
      new_entry:
        description: "New sighting entry"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Append new sighting to JSON
        run: |
          echo "${{ inputs.payload }}" > data/tmp.json
          jq --argjson entry "${{ inputs.new_entry }}" \
             '.locations += [$entry]' data/tmp.json > data/jimothy.json
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting"
          git push
