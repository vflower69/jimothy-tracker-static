<svg
  width="400"
  height="400"
  viewBox="0 0 400 400"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background (optional, remove if you want pure transparent) -->
  <rect x="0" y="0" width="400" height="400" fill="none" />

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="110" ry="95" fill="#4b4b4b" />

  <!-- Face mask -->
  <ellipse cx="200" cy="200" rx="90" ry="70" fill="#2f2f2f" />

  <!-- Inner face -->
  <ellipse cx="200" cy="205" rx="65" ry="50" fill="#d9d4c8" />

  <!-- Ears -->
  <ellipse cx="140" cy="120" rx="35" ry="30" fill="#4b4b4b" />
  <ellipse cx="260" cy="120" rx="35" ry="30" fill="#4b4b4b" />
  <ellipse cx="140" cy="120" rx="22" ry="18" fill="#d9d4c8" />
  <ellipse cx="260" cy="120" rx="22" ry="18" fill="#d9d4c8" />

  <!-- Eye patches -->
  <ellipse cx="165" cy="205" rx="35" ry="28" fill="#2f2f2f" />
  <ellipse cx="235" cy="205" rx="35" ry="28" fill="#2f2f2f" />

  <!-- Eyes -->
  <circle cx="165" cy="205" r="9" fill="#000000" />
  <circle cx="235" cy="205" r="9" fill="#000000" />
  <circle cx="162" cy="202" r="3" fill="#ffffff" />
  <circle cx="232" cy="202" r="3" fill="#ffffff" />

  <!-- Nose -->
  <ellipse cx="200" cy="225" rx="12" ry="9" fill="#1b1b1b" />

  <!-- Mouth -->
  <path
    d="M180 240 Q200 255 220 240"
    stroke="#1b1b1b"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Body -->
  <ellipse cx="200" cy="310" rx="90" ry="70" fill="#4b4b4b" />

  <!-- Belly -->
  <ellipse cx="200" cy="315" rx="55" ry="45" fill="#d9d4c8" />

  <!-- Tail -->
  <path
    d="M270 300
       C320 290 340 320 330 345
       C320 370 290 365 270 340
       Z"
    fill="#4b4b4b"
  />
  <!-- Tail stripes -->
  <path
    d="M280 305
       C305 300 320 315 315 330
       C310 345 295 345 285 335
       Z"
    fill="#2f2f2f"
  />
  <path
    d="M290 325
       C310 322 320 335 315 347
       C310 360 298 360 290 350
       Z"
    fill="#2f2f2f"
  />
</svg>
